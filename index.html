<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zinxy Come Home</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .video {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,.6);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .footer {
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💙 A little something for Zinxy</h1>

        <div class="video">
            <iframe
                src="https://www.youtube.com/embed/CjruBz8KDwY"
                title="Zinxy Come Home"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <div class="footer">
            zinxycomehome.org
        </div>

    </div>

</body>
</html>
